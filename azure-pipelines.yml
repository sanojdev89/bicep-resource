trigger:
- main  # Trigger on changes to the main branch

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'sanoj'  # Replace with your Azure Subscription name
  resourceGroupName: 'test-rg'  # Replace with your resource group name
  bicepFilePath: 'main.bicep'  # Replace with the path to your Bicep file

steps:
- task: AzureCLI@2
  displayName: 'Deploy Bicep File'
  inputs:
    azureSubscription: 'sanoj'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Deploy Bicep file
      az deployment group create \
        --resource-group $(resourceGroupName) \
        --template-file $(bicepFilePath)
